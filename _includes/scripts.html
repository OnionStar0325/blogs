<script>
document.addEventListener('DOMContentLoaded', () => {
  // Add copy button to code blocks
  const codeBlocks = document.querySelectorAll('div.highlighter-rouge, pre.highlight, .post-content pre');

  codeBlocks.forEach((block) => {
    // Prevent duplicate buttons if pre is inside highlighter-rouge
    if (block.tagName === 'PRE' && block.closest('div.highlighter-rouge')) {
      return;
    }

    const pre = block.tagName === 'PRE' ? block : block.querySelector('pre');
    if (!pre) return;

    // Ensure parent is relatively positioned
    block.style.position = 'relative';

    const copyButton = document.createElement('button');
    copyButton.className = 'copy-code-button';
    copyButton.type = 'button';
    copyButton.setAttribute('aria-label', '코드 복사');
    copyButton.innerHTML = `
      <svg class="copy-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
      </svg>
      <span>Copy</span>
    `;

    copyButton.addEventListener('click', async () => {
      const code = pre.querySelector('code') || pre;
      const text = code.innerText.replace(/\n$/, '');

      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
        } else {
          // Fallback for older or non-https contexts
          const textArea = document.createElement('textarea');
          textArea.value = text;
          textArea.style.position = 'fixed';
          textArea.style.opacity = '0';
          document.body.appendChild(textArea);
          textArea.focus();
          textArea.select();
          document.execCommand('copy');
          document.body.removeChild(textArea);
        }

        copyButton.classList.add('copied');
        copyButton.innerHTML = `
          <svg class="copy-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
          <span>Copied!</span>
        `;

        setTimeout(() => {
          copyButton.classList.remove('copied');
          copyButton.innerHTML = `
            <svg class="copy-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
            <span>Copy</span>
          `;
        }, 2000);
      } catch (err) {
        console.error('Failed to copy code: ', err);
      }
    });

    block.appendChild(copyButton);
  });
});
</script>

<script src="{{ '/assets/js/pikchr.js' | relative_url }}"></script>
<script>
// Client-side Pikchr WASM rendering and toggle interaction
document.addEventListener('DOMContentLoaded', async () => {
  const codeBlocks = Array.from(document.querySelectorAll('pre > code.language-pikchr, pre > code.pikchr-raw-src'));
  if (codeBlocks.length === 0) return;

  if (typeof window.loadPikchr !== 'function') {
    console.error('loadPikchr function is not available.');
    return;
  }

  try {
    const pikchr = await window.loadPikchr();

    codeBlocks.forEach((codeEl) => {
      const preEl = codeEl.closest('pre');
      if (!preEl) return;

      const srcText = codeEl.textContent.trim();
      if (!srcText) return;

      const result = pikchr.render(srcText, 'pikchr', 0);
      if (!result || !result.svg) {
        console.warn('Pikchr render produced no output for block');
        return;
      }

      // Create wrapper matching pikchr.org toggle layout
      const wrapper = document.createElement('div');
      wrapper.className = 'pikchr-wrapper toggle';
      wrapper.title = '클릭하여 소스 코드 보기';

      const widthStyle = result.width ? ` style="max-width:${Math.round(result.width)}px;"` : '';

      wrapper.innerHTML = `
        <div class="pikchr-svg"${widthStyle}>${result.svg}</div>
        <div class="pikchr-src" style="display:none;cursor:pointer;">
          <pre><code class="pikchr-raw-src"></code></pre>
        </div>
      `;

      // Safely assign text content to prevent XSS
      wrapper.querySelector('code.pikchr-raw-src').textContent = srcText;

      // Replace original pre block with the pikchr-wrapper
      preEl.parentNode.replaceChild(wrapper, preEl);

      const svgPane = wrapper.querySelector('.pikchr-svg');
      const srcPane = wrapper.querySelector('.pikchr-src');

      const toggle = (e) => {
        if (e && e.target && e.target.closest('.copy-code-button')) {
          return;
        }
        const isSrcVisible = srcPane.style.display !== 'none';
        if (isSrcVisible) {
          srcPane.style.display = 'none';
          svgPane.style.display = 'block';
          wrapper.classList.remove('pikchr-show-src');
        } else {
          svgPane.style.display = 'none';
          srcPane.style.display = 'block';
          wrapper.classList.add('pikchr-show-src');
        }
      };

      svgPane.addEventListener('click', toggle);
      srcPane.addEventListener('click', toggle);
    });
  } catch (err) {
    console.error('Failed to initialize Pikchr WASM:', err);
  }
});
</script>
