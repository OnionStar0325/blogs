<script>
document.addEventListener('DOMContentLoaded', () => {
  // 1. Add copy button to code blocks
  const codeBlocks = document.querySelectorAll('div.highlighter-rouge, pre.highlight, .post-content pre');

  codeBlocks.forEach((block) => {
    if (block.tagName === 'PRE' && block.closest('div.highlighter-rouge')) {
      return;
    }

    const pre = block.tagName === 'PRE' ? block : block.querySelector('pre');
    if (!pre) return;

    block.style.position = 'relative';

    const copyButton = document.createElement('button');
    copyButton.className = 'copy-code-button';
    copyButton.type = 'button';
    copyButton.setAttribute('aria-label', '코드 복사');
    copyButton.innerHTML = `
      <svg class="copy-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
      </svg>
      <span>Copy</span>
    `;

    copyButton.addEventListener('click', async () => {
      const code = pre.querySelector('code') || pre;
      const text = code.innerText.replace(/\n$/, '');

      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
        } else {
          const textArea = document.createElement('textarea');
          textArea.value = text;
          textArea.style.position = 'fixed';
          textArea.style.opacity = '0';
          document.body.appendChild(textArea);
          textArea.focus();
          textArea.select();
          document.execCommand('copy');
          document.body.removeChild(textArea);
        }

        copyButton.classList.add('copied');
        copyButton.innerHTML = `
          <svg class="copy-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
          <span>Copied!</span>
        `;

        setTimeout(() => {
          copyButton.classList.remove('copied');
          copyButton.innerHTML = `
            <svg class="copy-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
            <span>Copy</span>
          `;
        }, 2000);
      } catch (err) {
        console.error('Failed to copy code: ', err);
      }
    });

    block.appendChild(copyButton);
  });

  // 2. Prevent image downloading via context menu (right-click) and dragging
  document.addEventListener('contextmenu', (e) => {
    if (e.target && e.target.nodeName === 'IMG') {
      e.preventDefault();
      return false;
    }
  });

  document.addEventListener('dragstart', (e) => {
    if (e.target && e.target.nodeName === 'IMG') {
      e.preventDefault();
      return false;
    }
  });

  // 3. Interactive Image & Diagram Zoom/Pan Lightbox Modal
  const createLightbox = () => {
    const modal = document.createElement('div');
    modal.className = 'image-zoom-modal';
    modal.id = 'image-zoom-modal';
    modal.innerHTML = `
      <div class="zoom-modal-backdrop"></div>
      <div class="zoom-modal-toolbar">
        <button type="button" class="zoom-btn" id="zoom-in" title="확대 (+)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line><line x1="11" y1="8" x2="11" y2="14"></line><line x1="8" y1="11" x2="14" y2="11"></line></svg>
        </button>
        <button type="button" class="zoom-btn" id="zoom-out" title="축소 (-)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line><line x1="8" y1="11" x2="14" y2="11"></line></svg>
        </button>
        <button type="button" class="zoom-btn" id="zoom-reset" title="원래 크기">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg>
        </button>
        <button type="button" class="zoom-btn zoom-close" id="zoom-close" title="닫기 (ESC)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
      <div class="zoom-modal-viewport" id="zoom-viewport">
        <img class="zoom-modal-image" id="zoom-image" src="" alt="Enlarged preview">
      </div>
      <div class="zoom-modal-hint">
        <span>💡 마우스 드래그로 이동 / 휠로 확대 및 축소 (ESC로 닫기)</span>
      </div>
    `;
    document.body.appendChild(modal);

    let scale = 1;
    let translateX = 0;
    let translateY = 0;
    let isDragging = false;
    let startX = 0;
    let startY = 0;

    const img = modal.querySelector('#zoom-image');
    const viewport = modal.querySelector('#zoom-viewport');
    const backdrop = modal.querySelector('.zoom-modal-backdrop');
    const closeBtn = modal.querySelector('#zoom-close');
    const inBtn = modal.querySelector('#zoom-in');
    const outBtn = modal.querySelector('#zoom-out');
    const resetBtn = modal.querySelector('#zoom-reset');

    const updateTransform = () => {
      img.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
    };

    const openModal = (src, isMermaid) => {
      img.src = src;
      // Start diagrams with a comfortable larger scale
      scale = isMermaid ? 1.4 : 1.0;
      translateX = 0;
      translateY = 0;
      updateTransform();
      modal.classList.add('active');
      document.body.style.overflow = 'hidden';
    };

    const closeModal = () => {
      modal.classList.remove('active');
      document.body.style.overflow = '';
      setTimeout(() => { img.src = ''; }, 200);
    };

    // Zoom Buttons
    inBtn.addEventListener('click', () => {
      scale = Math.min(scale * 1.25, 6.0);
      updateTransform();
    });

    outBtn.addEventListener('click', () => {
      scale = Math.max(scale / 1.25, 0.4);
      updateTransform();
    });

    resetBtn.addEventListener('click', () => {
      scale = 1.0;
      translateX = 0;
      translateY = 0;
      updateTransform();
    });

    closeBtn.addEventListener('click', closeModal);
    backdrop.addEventListener('click', closeModal);

    // ESC to close
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && modal.classList.contains('active')) {
        closeModal();
      }
    });

    // Mouse Wheel Zoom
    viewport.addEventListener('wheel', (e) => {
      e.preventDefault();
      const zoomFactor = e.deltaY < 0 ? 1.15 : 0.85;
      scale = Math.min(Math.max(scale * zoomFactor, 0.4), 6.0);
      updateTransform();
    }, { passive: false });

    // Drag to Pan with Hand cursor
    viewport.addEventListener('mousedown', (e) => {
      if (e.button !== 0) return; // Left click only
      isDragging = true;
      startX = e.clientX - translateX;
      startY = e.clientY - translateY;
      viewport.classList.add('grabbing');
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      e.preventDefault();
      translateX = e.clientX - startX;
      translateY = e.clientY - startY;
      updateTransform();
    });

    window.addEventListener('mouseup', () => {
      if (isDragging) {
        isDragging = false;
        viewport.classList.remove('grabbing');
      }
    });

    return { openModal };
  };

  const lightbox = createLightbox();

  // Attach click to zoom on post images & diagrams
  const postImages = document.querySelectorAll('.post-content img');
  postImages.forEach((img) => {
    img.classList.add('zoomable-image');
    img.setAttribute('title', '클릭하여 확대 및 이동보기');
    img.addEventListener('click', () => {
      const isMermaid = img.classList.contains('mermaid') || img.src.includes('mermaid.ink');
      lightbox.openModal(img.src, isMermaid);
    });
  });
});
</script>
